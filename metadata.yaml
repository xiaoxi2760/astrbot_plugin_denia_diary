name: astrbot_plugin_denia_diary
display_name: 达妮娅的陪伴系统
desc: |
  给她一本自己的纯文本日记，外加小本本、状态（情绪 / 作息 / 熟悉度）与主动消息。
  数据全部落在可读的文件里（日记是纯文本），内核零第三方依赖，可离线测试。
  WebUI 观察面板 7 个 tab（总览 / 日记 / 小本本 / 熟悉度 / 曲线与主动 / 数据 / 设置）：
  日记有月历与"一页纸"渲染；设置页列出全部配置项、改完即生效（含一键恢复默认）；
  作息表用行式编辑器（注释与解析不了的行原样保留）；首页立绘支持用户自上传。
  面板文案全中文：概览大字给中文状态、数值降为副行；「对谁」显示「昵称(数字)」并可原地起名。
  出站文本会剥掉表情包标记；启用范围三档（只主人 / 只私聊 / 全部启用）决定她在哪些会话里工作，
  主动消息的对象也跟着这一档走。
author: "50841"
version: 0.9.0
astrbot_version: ">=4.24"
repo: https://github.com/xiaoxi2760/astrbot_plugin_denia_diary
