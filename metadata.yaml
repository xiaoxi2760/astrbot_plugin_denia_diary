name: astrbot_plugin_denia_diary
display_name: 情绪日记
short_desc: 日记与主动消息插件：让 bot 写日记、记日程、记好感
desc: 日记和主动消息插件，可让 bot 写日记并记录日程、好感之类的。
  数据全部落在可读的文件里（日记是纯文本），内核零第三方依赖、可离线测试；
  自带 WebUI 观察面板（总览 / 日记 / 小本本 / 熟悉度 / 曲线与主动 / 数据 / 设置），
  面板标题和首页立绘都可以自己改。
version: 1.4.0
author: "xiaoxi2760"
repo: https://github.com/xiaoxi2760/astrbot_plugin_denia_diary
astrbot_version: ">=4.24.2"
support_platforms:
  - aiocqhttp
tags:
  - 日记
  - 情绪
  - 陪伴
  - WebUI
