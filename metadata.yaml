name: astrbot_plugin_denia_diary
display_name: 达妮娅的陪伴系统
desc: |
  给她一本自己的纯文本日记，外加小本本、状态（情绪 / 作息 / 熟悉度）与主动消息。
  数据全部落在可读的文件里（日记是纯文本），内核零第三方依赖，可离线测试。
  WebUI 观察面板 7 个 tab（总览 / 日记 / 小本本 / 熟悉度 / 曲线与主动 / 数据 / 设置），
  设置页列出全部配置项且改完即生效（含一键恢复默认），首页立绘支持用户自上传。
  出站文本会剥掉表情包标记，不再漏给用户。
author: "50841"
version: 0.7.0
astrbot_version: ">=4.24"
