<!DOCTYPE html>
<html lang="zh-CN" data-theme="sakura">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>情绪日记 · 观察面板</title>
<!-- 相对路径 + 版本 query：Dashboard 会重写资源引用，query 免得浏览器缓存住旧 CSS（任务书 §10 建议） -->
<link rel="stylesheet" href="./style.css?v=1.2.0" />
</head>
<body>
<div id="guard" class="guard" hidden>
  <div class="guard-card">
    <div class="guard-title">请从插件详情页打开本页面</div>
    <p class="guard-text">
      这个页面需要 AstrBot Dashboard 的插件页运行环境（受限 iframe + 注入的 bridge）。
      直接用 <code>file://</code> 打开、或者 bridge 没就绪，都拿不到数据。
    </p>
    <p class="guard-text">路径：Dashboard → 插件管理 → astrbot_plugin_denia_diary → 插件页。</p>
  </div>
</div>

<div id="app" class="app" hidden>
  <aside class="nav">
    <!-- 左上角这两行是**用户自己定的**（配置项 panel.brand / panel.brand_sub，设置页可改）：
         这里的文字只是「拿不到配置时」的默认值，app.js 启动时按后端回的值覆盖。
         留空串＝那一行整个不显示，所以别把默认字面量写死在 CSS 里。 -->
    <div class="brand" id="brand">情绪日记</div>
    <div class="brand-sub" id="brand-sub">观察面板</div>
    <nav class="tabs" id="tabs" role="tablist" aria-label="面板视图"></nav>
    <div class="nav-foot">
      <label class="foot-label" for="theme-picker">外观</label>
      <select id="theme-picker" class="who-picker" title="外观预设（记在这台设备上）"></select>
      <label class="foot-label" for="who-picker">对谁</label>
      <select id="who-picker" class="who-picker" title="面板按人组织，不按会话"></select>
      <!-- 「起个名」：昵称要等"她下次跟你说话时"才落盘，群里根本不记，
           所以主人那位常常只有数字。给它一个内联改名入口，比干等划算。
           受限 iframe 没有 allow-modals，所以**绝不**用 window.prompt。 -->
      <button id="who-rename" class="btn btn-sm who-rename" type="button"
              title="给当前这个人起个名字（会写进称呼偏好）">起个名</button>
      <div class="who-name-edit" id="who-name-edit" hidden>
        <input id="who-name-input" class="set-input" type="text" maxlength="24"
               placeholder="留空＝删掉这个名字" />
        <button id="who-name-ok" class="btn btn-sm" type="button">确定</button>
        <button id="who-name-cancel" class="btn btn-sm" type="button">取消</button>
      </div>
      <div class="who-hint" id="who-hint">对谁</div>
    </div>
  </aside>

  <main class="stage">
    <header class="stage-head">
      <h1 class="stage-title" id="stage-title">总览</h1>
      <div class="stage-tools">
        <span class="stage-note" id="stage-note"></span>
        <!-- 启用范围三段切换（主入口，第 7 步）。即时生效：点一下就 POST settings，
             不必去设置页点保存。面板本身不受这一档影响——切到「只主人」后群里照样能看能改。 -->
        <div class="scope-bar" id="scope-bar"></div>
        <button class="btn" id="refresh" type="button">刷新</button>
      </div>
    </header>

    <!-- 立绘区。一次只展示一张，右边一个切换按钮 + 上传 / 删除。
         图源**只有一种**：用户自己传的那张（接口 GET portrait 回的 current.data_url）。
         打包进来的默认立绘在第 10 步删掉了（公开发布不夹带角色立绘，也免得替用户
         决定放谁的照片），所以没有图时**必须**有 #portrait-empty 这块占位——
         既告诉用户"这里可以放图"，也保证总览不开天窗。
         ⚠️ img#portrait-img 的 src 由 JS 设（data_url 不经过服务端重写）；
         想改成打包静态图的话得注意：JS 里设 "./assets/x.jpg" 拿不到 asset_token，真机会 403。 -->
    <div id="portraits" class="portrait-strip">
      <figure class="portrait" id="portrait-frame">
        <img id="portrait-img" alt="" hidden>
        <div class="portrait-empty" id="portrait-empty">
          <div class="portrait-empty-title">这里可以放图</div>
          <p class="portrait-empty-text">
            点右边的「选择文件」传一张立绘（png / jpg / webp / gif，8 MB 以内），
            传好就显示在这里。
          </p>
        </div>
      </figure>
      <div class="portrait-side">
        <div class="portrait-count" id="portrait-count"></div>
        <div class="portrait-actions">
          <button class="btn" id="portrait-switch" type="button">切换</button>
          <button class="btn" id="portrait-delete" type="button">删这张</button>
          <!-- 直接用可见的 file input（而不是 <label for> + hidden input）：
               隐藏元素在可访问性树和自动化里都是死的，这里要能被点也要能被测。 -->
          <input id="portrait-file" class="portrait-file" type="file"
                 accept="image/png,image/jpeg,image/webp,image/gif"
                 title="上传一张立绘（png / jpg / webp / gif，8 MB 以内）">
        </div>
      </div>
    </div>

    <section class="stage-body" id="stage-body" role="tabpanel" aria-live="polite"></section>
  </main>
</div>

<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

<!-- 预览桩：只在 file:// 或 ?preview=1 时安装假 bridge，正式 iframe 里什么也不做（§0#11/12 的红线不被破坏） -->
<script src="./preview-bridge.js?v=1.2.0"></script>
<script src="./ui.js?v=1.2.0"></script>
<script src="./app.js?v=1.2.0"></script>
<script src="./views/overview.js?v=1.2.0"></script>
<script src="./views/diary.js?v=1.2.0"></script>
<script src="./views/notebook.js?v=1.2.0"></script>
<script src="./views/affinity.js?v=1.2.0"></script>
<script src="./views/proactive.js?v=1.2.0"></script>
<script src="./views/data.js?v=1.2.0"></script>
<script src="./views/settings.js?v=1.2.0"></script>
</body>
</html>
